name: Live feed

# Every 3 hours: fetch CAL FIRE, NASA FIRMS and NWS, update the feed, publish it to GitHub Pages.
# State (alert history, footprints, HTTP cache) is carried between runs in the Actions cache.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-feed
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Restore feed state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state
          key: feed-state-${{ github.run_id }}
          restore-keys: feed-state-
      - name: Run the feed
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          RISKFEED_WEBHOOK_URL: ${{ secrets.RISKFEED_WEBHOOK_URL }}
        run: uv run riskfeed tick --state state/feed.duckdb --out public > run.json
      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          run = json.load(open("run.json"))
          print(f"### Feed run {run['run_id']}: {run['completeness']}\n")
          print("| Source | Health | Detail |\n|---|---|---|")
          for name, s in run["sources"].items():
              print(f"| {name} | {s['health']} | {s['detail']} |")
          print(f"\nCells by level: {run['levels']}\n")
          for t in run["transitions"]:
              print(f"- {t}")
          PY
      - name: Save feed state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state
          key: feed-state-${{ github.run_id }}
      - name: Keep notifications out of the public site
        run: rm -f public/notifications.jsonl
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: tick
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
